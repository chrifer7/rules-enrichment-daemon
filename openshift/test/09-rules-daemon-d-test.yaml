apiVersion: apps/v1
kind: Deployment
metadata:
  name: rules-enrichment-daemon-test-d
  labels:
    app.kubernetes.io/name: rules-enrichment-daemon
    app.kubernetes.io/environment: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rules-enrichment-daemon
      app.kubernetes.io/environment: test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rules-enrichment-daemon
        app.kubernetes.io/environment: test
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: daemon-logs
          emptyDir: {}
      containers:
        - name: daemon
          image: rules-enrichment-daemon-test-is:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.interfaces.cli.main", "run-daemon"]
          envFrom:
            - configMapRef:
                name: rules-enrichment-daemon-test-config
            - secretRef:
                name: rules-enrichment-daemon-test-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: daemon-logs
              mountPath: /tmp/rules-enrichment-daemon
        - name: log-shipper
          image: rules-enrichment-daemon-test-is:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.interfaces.cli.main", "forward-log-file"]
          envFrom:
            - configMapRef:
                name: rules-enrichment-daemon-test-config
            - secretRef:
                name: rules-enrichment-daemon-test-secret
          env:
            - name: LOG_TO_FILE
              value: "false"
            - name: LOG_TO_STDOUT
              value: "true"
            - name: LOG_FILE_PATH
              value: /tmp/rules-enrichment-daemon/daemon.log
            - name: LOG_SHIPPER_ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-auth
                  key: ES_USERNAME
                  optional: true
            - name: LOG_SHIPPER_ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-auth
                  key: ES_PASSWORD
                  optional: true
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 150m
              memory: 192Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: daemon-logs
              mountPath: /tmp/rules-enrichment-daemon
        - name: health
          image: rules-enrichment-daemon-test-is:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.interfaces.health.api:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - name: health
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: rules-enrichment-daemon-test-config
            - secretRef:
                name: rules-enrichment-daemon-test-secret
          env:
            - name: LOG_TO_FILE
              value: "false"
            - name: LOG_TO_STDOUT
              value: "true"
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /live
              port: health
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
