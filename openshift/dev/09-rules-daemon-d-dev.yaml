apiVersion: apps/v1
kind: Deployment
metadata:
  name: rules-enrichment-daemon-dev-d
  labels:
    app.kubernetes.io/name: rules-enrichment-daemon
    app.kubernetes.io/environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rules-enrichment-daemon
      app.kubernetes.io/environment: dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rules-enrichment-daemon
        app.kubernetes.io/environment: dev
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: daemon-logs
          # Shared scratch space inside the pod. The daemon writes the log file here and
          # the shipper sidecar reads the same file from the same mount path.
          emptyDir: {}
      containers:
        - name: daemon
          image: rules-enrichment-daemon-dev-is:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ "${USE_SQLITE:-false}" = "true" ]; then
                alembic upgrade head
                python -m app.interfaces.cli.main seed-rules
              fi
              # The main application process keeps writing business logs to stdout and,
              # when enabled, to /tmp/rules-enrichment-daemon/daemon.log.
              python -m app.interfaces.cli.main run-daemon
          envFrom:
            - configMapRef:
                name: rules-enrichment-daemon-dev-config
            - secretRef:
                name: rules-enrichment-daemon-dev-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: daemon-logs
              mountPath: /tmp/rules-enrichment-daemon
        - name: log-shipper
          image: rules-enrichment-daemon-dev-is:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ "${LOG_SHIPPER_ENABLED:-true}" = "true" ]; then
                # Sidecar process: tail the shared log file and forward only new lines.
                python -m app.interfaces.cli.main forward-log-file
              else
                echo "rules-enrichment-daemon log shipper disabled; keeping sidecar idle"
                sleep infinity
              fi
          envFrom:
            - configMapRef:
                name: rules-enrichment-daemon-dev-config
            - secretRef:
                name: rules-enrichment-daemon-dev-secret
          env:
            - name: LOG_TO_FILE
              # This flag applies to the shipper's own logs, not to the daemon's logs.
              value: "false"
            - name: LOG_TO_STDOUT
              value: "true"
            - name: LOG_FILE_PATH
              # Points to the shared file produced by the daemon container.
              value: /tmp/rules-enrichment-daemon/daemon.log
            - name: LOG_SHIPPER_ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-auth
                  key: ES_USERNAME
                  optional: true
            - name: LOG_SHIPPER_ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-auth
                  key: ES_PASSWORD
                  optional: true
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 150m
              memory: 192Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: daemon-logs
              mountPath: /tmp/rules-enrichment-daemon
        - name: health
          image: rules-enrichment-daemon-dev-is:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.interfaces.health.api:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - name: health
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: rules-enrichment-daemon-dev-config
            - secretRef:
                name: rules-enrichment-daemon-dev-secret
          env:
            - name: LOG_TO_FILE
              # Health container should not write to the shared file to avoid noise.
              value: "false"
            - name: LOG_TO_STDOUT
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
